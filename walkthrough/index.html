<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
</head>
<body style="margin:0">
<title>Heme Workshop Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Nunito+Sans:wght@300..800&display=swap">
<style>
/* Layout: a pager. Each page is split: cream = what the student sees, navy = what we prepare. Station colors carry through the puzzle map and the patient pages. */
:root{--paper:#FBF7F2;--card:#FFFFFF;--ink:#1B2A41;--muted:#4A5568;--line:#E6DED4;--soft:#F1E9DF;--navy:#223B63;--navy2:#2C4A7A;--navy-ink:#F3EEE6;--navy-muted:#B9C6DD;--coral:#B9534C;--pink:#E9A6A0;
--s1:#6B4C9A;--s2:#B9534C;--s3:#2E7D83;--s4:#A8701C;--s5:#3F5F9A;
--c1:#2F8F4E;--c2:#C2407E;--c3:#8A9A1B;--c4:#5A6578;--c5:#8A5A3C;--onc:#FFFFFF;
--display:Fraunces,Georgia,serif;--body:'Nunito Sans',Verdana,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121A28;--card:#1B2436;--ink:#F3EEE6;--muted:#C2CAD6;--line:#2C394F;--soft:#232E44;--navy:#0B1220;--navy2:#1A2740;--navy-ink:#F3EEE6;--navy-muted:#A9B8D2;--coral:#EE958D;--pink:#C98882;--s1:#B9A6D9;--s2:#EE958D;--s3:#6CC3C9;--s4:#E2B25C;--s5:#9DB4E6;--c1:#6FCF8F;--c2:#EE8AB8;--c3:#C5D45A;--c4:#A9B4C2;--c5:#D1A080;--onc:#10151F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121A28;--card:#1B2436;--ink:#F3EEE6;--muted:#C2CAD6;--line:#2C394F;--soft:#232E44;--navy:#0B1220;--navy2:#1A2740;--navy-ink:#F3EEE6;--navy-muted:#A9B8D2;--coral:#EE958D;--pink:#C98882;--s1:#B9A6D9;--s2:#EE958D;--s3:#6CC3C9;--s4:#E2B25C;--s5:#9DB4E6;--c1:#6FCF8F;--c2:#EE8AB8;--c3:#C5D45A;--c4:#A9B4C2;--c5:#D1A080;--onc:#10151F;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance}
h1{font-size:clamp(2.2rem,1.2rem + 4.5vw,4.6rem);font-weight:300;line-height:1.02}
h2{font-size:clamp(1.5rem,1.1rem + 1.8vw,2.5rem);line-height:1.1}
h3{font-size:1.15rem}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.bar b{font-family:var(--display);color:var(--ink);font-weight:600}
.key{display:flex;gap:14px;align-items:center}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stage{flex:1;min-height:0;overflow:auto;padding-block:18px}
.pg{display:none;max-width:1180px;margin:0 auto;min-height:100%;flex-direction:column;gap:18px}
.pg.on{display:flex}
.rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*110ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px;border-top:1px solid var(--line)}
.nav button{font:inherit;font-weight:800;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer}
.nav button:hover{background:var(--ink);color:var(--paper)}
.nav button:focus-visible,.dots button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.nav button:disabled{opacity:.3;cursor:default;background:var(--card);color:var(--ink)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:transparent;cursor:pointer}
.dots button.on{background:var(--coral);border-color:var(--coral)}
/* split */
.head{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.time{font-family:var(--display);font-size:1.3rem;font-weight:600;color:var(--c,var(--coral));font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;flex:1}
.see,.prep{border-radius:10px;padding:clamp(16px,2.5vw,28px);display:flex;flex-direction:column;gap:14px}
.see{background:var(--card);border:1px solid var(--line)}
.prep{background:var(--navy);color:var(--navy-ink)}
.tag{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.see .tag{color:var(--c,var(--coral))}.prep .tag{color:var(--navy-muted)}
.ill{width:100%;max-height:230px;border-radius:8px;background:var(--soft)}
.pts{list-style:none;padding:0;display:grid;gap:8px;font-size:1.02rem}
.pts li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.pts li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--coral));margin-top:7px}
.prep .pts li::before{background:transparent;border:2px solid var(--navy-muted);border-radius:2px;width:12px;height:12px;margin-top:5px}
.who{margin-top:auto;font-size:.9rem;color:var(--navy-muted);border-top:1px solid rgba(255,255,255,.16);padding-top:10px}
.who b{color:var(--navy-ink)}
/* svg helpers */
svg .k{stroke:var(--ink);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .w{fill:var(--card)}svg .f{fill:var(--c,var(--coral))}svg .i{fill:var(--ink)}svg .p{fill:var(--pink)}svg .m{fill:var(--muted)}
svg text{font-family:var(--body);fill:var(--ink)}
.bob{animation:bob 4s ease-in-out infinite}.bob.b2{animation-delay:1.3s}.bob.b3{animation-delay:2.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.ride{animation:ride 6s linear infinite}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(150px)}}
.fillx{transform-box:fill-box;transform-origin:left;animation:fillx 5s ease-out infinite}
@keyframes fillx{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.beam{stroke-dasharray:6 8;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-140}}
/* cover */
.cover{justify-content:center;gap:26px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px}
.legend div{border-radius:10px;padding:18px}
.legend .a{background:var(--card);border:1px solid var(--line)}.legend .b{background:var(--navy);color:var(--navy-ink)}
.legend b{font-family:var(--display);font-size:1.3rem;font-weight:500;display:block}
/* timeline */
.scroll{overflow-x:auto}
.tl{min-width:900px;position:relative}
.ribbon{display:flex;height:96px;border-radius:8px;overflow:hidden;font-size:.82rem;font-weight:700;line-height:1.15}
.ribbon div{display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;border-right:2px solid var(--paper);background:var(--soft)}
.ribbon .st{background:var(--navy);color:#F3EEE6}.ribbon .hi{background:var(--coral);color:#fff}
.ribbon .v{writing-mode:vertical-rl;transform:rotate(180deg)}
.play{position:absolute;top:-6px;height:108px;width:4px;background:var(--ink);border-radius:2px;animation:play 24s linear infinite;opacity:.8}
@keyframes play{from{left:0}to{left:100%}}
.ticks{position:relative;height:24px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:5px;transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three div{border-top:3px solid var(--ink);padding-top:8px}
.three b{font-family:var(--display);font-size:1.25rem;font-weight:500;display:block}
.three span{color:var(--muted);font-size:.95rem}
/* ring */
.ringwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;flex:1}
.ring{width:100%;max-width:520px;justify-self:center}
.ring .path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:6 8;animation:dash 6s linear infinite}
.ring .n text{font-family:var(--display);font-size:24px;font-weight:600;fill:#fff;text-anchor:middle}
.ring .lab{font-size:14px;font-weight:800;text-anchor:middle}
.ring .hub{font-family:var(--display);font-size:16px;fill:var(--muted);text-anchor:middle}
.teams{transform-origin:260px 215px;animation:turn 20s cubic-bezier(.6,0,.3,1) infinite}
.tk{transform-box:fill-box;transform-origin:center;animation:turnb 20s cubic-bezier(.6,0,.3,1) infinite}
.tk circle{fill:var(--card);stroke:var(--ink);stroke-width:2}.tk text{font-size:12px;font-weight:800;text-anchor:middle}
@keyframes turn{0%,16%{transform:rotate(0)}20%,36%{transform:rotate(72deg)}40%,56%{transform:rotate(144deg)}60%,76%{transform:rotate(216deg)}80%,96%{transform:rotate(288deg)}100%{transform:rotate(360deg)}}
@keyframes turnb{0%,16%{transform:rotate(0)}20%,36%{transform:rotate(-72deg)}40%,56%{transform:rotate(-144deg)}60%,76%{transform:rotate(-216deg)}80%,96%{transform:rotate(-288deg)}100%{transform:rotate(-360deg)}}
.slist{display:grid;gap:10px}
.slist button{font:inherit;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:10px 14px;cursor:pointer;display:grid;gap:2px}
.slist button:hover{background:var(--soft)}
.slist b{font-family:var(--display);font-size:1.15rem;font-weight:500}.slist span{color:var(--muted);font-size:.9rem}
/* matrix */
.mx{display:grid;grid-template-columns:150px repeat(5,minmax(120px,1fr)) minmax(130px,1fr);gap:6px;min-width:980px}
.mx .h{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 8px;border-radius:6px;color:#fff;background:var(--c);text-align:center}
.mx .h.x{background:transparent;color:var(--muted)}.mx .h.ans{background:var(--ink);color:var(--paper)}
.mx .pt{padding:8px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;border-radius:6px;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.mx .pt:hover{background:var(--soft)}
.mx .pt b{font-family:var(--display);font-size:1.1rem;font-weight:500}.mx .pt span{font-size:.78rem;color:var(--muted)}
.mx .c{border-radius:8px;padding:8px 9px;font-size:.84rem;line-height:1.25;background:color-mix(in srgb,var(--c) 14%,var(--card));border-top:3px solid var(--c);animation:glow 15s ease-in-out infinite;animation-delay:calc(var(--col)*3s)}
.mx .c.key{background:var(--c);color:#fff;font-weight:700}
.mx .c.no{background:transparent;border:1px dashed var(--line);border-top:3px solid var(--line);color:var(--muted)}
.mx .a{border-radius:8px;padding:8px 9px;font-size:.86rem;font-weight:800;background:var(--ink);color:var(--paper);display:flex;align-items:center}
@keyframes glow{0%,4%{box-shadow:0 0 0 0 transparent;transform:none}8%,16%{box-shadow:0 6px 0 -2px var(--c);transform:translateY(-3px)}20%,100%{box-shadow:0 0 0 0 transparent;transform:none}}
.mxkey{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.mxkey i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
/* patient */
.pat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:16px;flex:1}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}
.pcard .big{font-family:var(--display);font-size:2.6rem;font-weight:300;line-height:1}
.looks{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
.pieces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pc{position:relative;border-radius:10px;padding:14px 12px 12px;background:color-mix(in srgb,var(--c) 13%,var(--card));border-top:5px solid var(--c);display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.pc::after{content:"";position:absolute;right:-9px;top:44%;width:16px;height:16px;border-radius:50%;background:var(--c);z-index:1}
.pc:last-child::after{display:none}
.pc small{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.pc.key{background:var(--c);color:#fff}.pc.key small{color:#fff}
.pc.key::before{content:"decides it";position:absolute;top:-14px;right:8px;background:var(--ink);color:var(--paper);font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.ans{background:var(--ink);color:var(--paper);border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.ans b{font-family:var(--display);font-size:1.5rem;font-weight:400}
.back{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 11px;font-size:.84rem}
.right{display:flex;flex-direction:column;gap:14px}
/* build list */
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;flex:1}
.four div{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.four h3{font-size:1.35rem}.four ul{padding-left:1.1em;display:grid;gap:5px;font-size:.95rem;color:var(--navy-muted)}
.note{font-size:.88rem;color:var(--muted)}
/* cases: squares in their own palette, never circles, so they cannot be read as stations (circles) or teams (plain tokens) */
.cs{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--c);color:var(--onc);font-family:var(--display);font-weight:600;font-size:.8rem;margin-right:6px;font-style:normal;vertical-align:middle;flex:none}
.chip{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 3px;margin:2px 4px 2px 0;font-size:.84rem;color:var(--ink);background:var(--card);line-height:1.2}
.chip .cs{width:18px;height:18px;font-size:.7rem;margin-right:6px}
.ckey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;align-items:center}
.ckey span{display:inline-flex;align-items:center}
.ckey b{font-weight:800;margin-right:8px;color:var(--muted);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tkn{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card);margin-right:4px;vertical-align:-2px}
.pcard .dx{font-size:.95rem;font-weight:700;color:var(--muted);line-height:1.2}
.pcard .ag{font-size:.82rem;color:var(--muted)}
/* objectives map */
.om{display:grid;grid-template-columns:34px minmax(0,2.3fr) repeat(6,minmax(52px,.5fr)) minmax(0,2fr);gap:6px 8px;align-items:center;min-width:900px}
.om .h{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px 2px;border-radius:6px;color:#fff;background:var(--c,var(--ink))}
.om .h.l{background:transparent;color:var(--muted);text-align:left}
.om .n{font-family:var(--display);font-size:1.5rem;font-weight:300;color:var(--s1);text-align:center}
.om .o{font-size:.95rem;line-height:1.25}.om .o b{font-weight:800}
.om .d{display:grid;place-items:center}
.om .d i{width:22px;height:22px;border-radius:50%;display:block;background:var(--c);animation:pulse 3.2s ease-in-out infinite;animation-delay:calc(var(--col)*.4s)}
.om .d i.s{background:transparent;border:2px solid var(--c);animation:none}
.om .w{font-size:.8rem;color:var(--muted);line-height:1.3}
.om .rl{grid-column:1/-1;border-top:1px solid var(--line);height:0}
/* prep pages */
.four.eight{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.four.eight div{padding:14px 16px;gap:6px}
.four.eight h3{font-size:1.1rem}
.four.eight ul{font-size:.84rem;gap:3px;padding-left:1.05em}
.tw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;flex:1}
.wl{list-style:none;padding:0 0 0 22px;margin:0 0 0 10px;display:grid;gap:5px;border-left:3px solid var(--line)}
.wl li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;font-size:.9rem;position:relative}
.wl li::before{content:"";position:absolute;left:-30px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--coral);animation:pulse 3.4s ease-in-out infinite}
.wl li b{font-family:var(--display);font-weight:600;color:var(--coral);font-variant-numeric:tabular-nums}
.wl li.day b{color:var(--ink)}.wl li.day::before{background:var(--ink)}
.irb{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.irb h3{font-size:1.2rem}.irb .tag{color:var(--navy-muted)}
.irb ul{padding-left:1.1em;display:grid;gap:5px;font-size:.88rem;color:var(--navy-muted)}
.irb ul b{color:var(--navy-ink)}
.irb .nb{margin-top:auto;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;font-size:.88rem}
/* consolidated rows */
.row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.lt{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:14px 18px;display:grid;grid-template-columns:176px minmax(0,1fr);gap:16px;align-items:center}
.lt .ill{max-height:132px}
.lt h3{font-size:1.3rem;margin:2px 0 8px}
.lt .tm{font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--c);font-variant-numeric:tabular-nums}
.lt .pts{gap:5px;font-size:.96rem}
.row .prep{padding:14px 18px;gap:8px;border-radius:10px}
.row .prep .pts{gap:5px;font-size:.95rem}
.row .who{margin-top:auto;padding-top:8px}
.pgs{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.hero2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:end}
.hero2 h1{font-size:clamp(2rem,1.2rem + 3.2vw,3.5rem)}
.legend2{display:grid;gap:10px}.legend2 div{border-radius:10px;padding:12px 16px}.legend2 .a{background:var(--card);border:1px solid var(--line)}.legend2 .b{background:var(--navy);color:var(--navy-ink)}.legend2 b{font-family:var(--display);font-size:1.15rem;font-weight:500;display:block}
.prow{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:12px;align-items:stretch}
.prow .pcard{padding:14px;gap:6px}.prow .pcard .big{font-size:1.9rem}.prow .pcard p{font-size:.88rem}
.prow .pieces{gap:8px}.prow .pc{font-size:.8rem;padding:10px 8px 8px;gap:4px}.prow .pc small{font-size:.64rem}
.prow .rcol{display:flex;flex-direction:column;gap:8px}
.prow .ans{padding:10px 14px;flex-direction:column;gap:2px;align-items:flex-start}.prow .ans b{font-size:1.1rem;line-height:1.15}
.prow .back{padding:10px 14px;gap:6px;flex:1}.prow .chips span{font-size:.76rem;padding:2px 9px}
@media (max-width:900px){.row,.lt,.prow,.hero2{grid-template-columns:1fr}}

pages.push(`<section class="pg">${hd('Before the day','Eight lists to finish ahead of time')}<div class="four eight"><div class="rise" style="--i:1"><h3>1. Logistics</h3><ul><li>Rooms booked: the Horn, the multi-head room, the core lab route, the E&amp;R room</li><li>Breakfast, break and lunch ordered</li><li>Weekend building access and escorts</li><li>Badges, signs, a place for bags</li><li>Lab floor rules: phones, escorts, route</li><li>A fallback for weather or no-shows</li></ul></div><div class="rise" style="--i:2"><h3>2. Things</h3><ul><li>Glass for five cases and the normals</li><li>CBC printouts, flow plots, clinical sheets</li><li>A final report for each case</li><li>Demo tubes, including two for Case 4</li><li>Badges with QR codes</li><li>Certificates, name cards, paper copies of every report</li><li>Marketing videos to send: teaser, invitation, reminders, recap</li></ul></div><div class="rise" style="--i:3"><h3>3. People</h3><ul><li>Station leads: Dr. Wey, Dr. Inamdar, OZB with the core lab team</li><li>A resident or fellow for flow</li><li>A hematology clinician, with a backup</li><li>Residents who walk with the teams</li><li>Someone for tech support on the day</li><li>The IRB office and the department, for approvals</li></ul></div><div class="rise" style="--i:4"><h3>4. Tools</h3><ul><li>A facilitator guide and a 27-minute script for each station</li><li>Scoring rubric for the summative huddle</li><li>Jeopardy question bank</li><li>Pre and post survey questions</li><li>Case log and report templates</li><li>A run-of-show with the clock</li></ul></div><div class="rise" style="--i:5"><h3>5. Preps</h3><ul><li>Case review with Dr. Wey</li><li>Resident briefing</li><li>App dry run with test teams</li><li>A timed walk of the route</li><li>Each station run once</li><li>Dress rehearsal the week before</li><li>Sound, video and Wi-Fi check that morning</li></ul></div><div class="rise" style="--i:6"><h3>6. Dates</h3><ul><li>A Saturday between March and May 2027, not yet chosen</li><li>Suggested: Mar 13, Apr 10, Apr 17, May 1</li><li>Sign-up opens a few months ahead and closes at a deadline</li><li>Registration capped at 30, with a waitlist</li><li>A follow-up survey 4 to 6 weeks after</li><li>The week-by-week timeline is on the next page</li></ul></div><div class="rise" style="--i:7"><h3>7. Pre-work (ours)</h3><ul><li>Confirm the date and the rooms</li><li>Ask the IRB whether the project needs review</li><li>Chair and department approvals</li><li>Confirm the station leads and the clinician</li><li>Agree the survey questions and where the data is kept</li><li>Students have no pre-work: everything is taught on the day</li></ul></div><div class="rise" style="--i:8"><h3>8. Technology</h3><ul><li>The companion app: QR dashboards, teams, case log, report builder</li><li>An admin console for timed pushes</li><li>The draw, Jeopardy voting, a live scoreboard</li><li>A simple data file of our own for survey answers, no REDCap</li><li>Six films and the gear to make them</li><li>Screens, projector, multi-head camera, Wi-Fi with a hotspot backup</li><li>A paper fallback for every scored step</li></ul></div></div><p class="note rise" style="--i:9">Patients are fictional. Case 5 (sickle cell disease, aplastic crisis) is a draft for Dr. Wey to edit. Room names and station leads are to be confirmed.</p></section>`);
pages.push(`<section class="pg">${hd('Before the day','The timeline, the IRB and the data')}<div class="tw"><ol class="wl"><li class="rise" style="--i:1"><b>20 weeks or more</b><span>Choose the date. Book the rooms. Ask the IRB office whether review is needed. Confirm the station leads and the clinician.</span></li><li class="rise" style="--i:2"><b>16 weeks</b><span>Draft the five case files and pull the glass. Write the survey questions.</span></li><li class="rise" style="--i:3"><b>12 weeks</b><span>The IRB answer is in hand. Marketing starts and sign-up opens.</span></li><li class="rise" style="--i:4"><b>10 weeks</b><span>App ready for testing. Film scripts and facilitator guides written.</span></li><li class="rise" style="--i:5"><b>8 weeks</b><span>Films recorded. First app dry run with test teams. Residents briefed. Lunch and breaks ordered.</span></li><li class="rise" style="--i:6"><b>6 weeks</b><span>Sign-up closes. Teams assigned. Badges printed.</span></li><li class="rise" style="--i:7"><b>4 weeks</b><span>Timed walk of the route. Each station run once.</span></li><li class="rise" style="--i:8"><b>2 weeks</b><span>App frozen. Jeopardy bank finished. Everything printed.</span></li><li class="rise" style="--i:9"><b>1 week</b><span>Dress rehearsal. Reminders to students.</span></li><li class="rise day" style="--i:10"><b>The day</b><span>Tech check at 7:30. Doors at 8:30.</span></li><li class="rise" style="--i:11"><b>1 week after</b><span>Thank-you and the references.</span></li><li class="rise" style="--i:12"><b>4 to 6 weeks after</b><span>Follow-up survey. Then the analysis and the write-up.</span></li></ol><div class="irb rise" style="--i:3"><span class="tag">IRB and the data</span><h3>Check before anything is collected</h3><ul><li><b>Why:</b> we plan to publish, so the pre and post surveys may count as research.</li><li><b>Ask:</b> the IRB office at Henry Ford, and whether Michigan State also needs to weigh in. Is this exempt, or not human-subjects research? Do students need to consent to their answers being used?</li><li><b>Bring:</b> the plan, the survey questions, how the data are stored, and who sees them.</li><li><b>Data:</b> typed into the app, kept in a simple file we control, a code instead of a name, one place, limited access, backed up. No REDCap.</li><li><b>Timing:</b> do not open sign-up or collect any answers until the IRB reply is in.</li></ul><div class="nb">Students sign or read nothing before the day. If the IRB asks for a consent or information sheet, it is shown on arrival.</div></div></div><p class="note rise" style="--i:8">Candidate Saturdays: March 13, April 10, April 17 and May 1 are suggested. Avoid March 27 (Easter weekend) and May 29 (Memorial Day weekend). April 24 falls in Passover and May 8 is the day before Mother\'s Day. Check each against the schools\' exam and break calendars.</p></section>`);

const stage=document.getElementById('stage');stage.innerHTML=pages.join('');
const pg=[...stage.querySelectorAll('.pg')],dots=document.getElementById('dots');let cur=0;
pg.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Page '+(i+1));b.onclick=()=>go(i);dots.appendChild(b)});
function go(i){cur=Math.max(0,Math.min(pg.length-1,i));pg.forEach((p,j)=>p.classList.toggle('on',j===cur));[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));document.getElementById('count').textContent=(cur+1)+' of '+pg.length;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===pg.length-1;stage.scrollTop=0}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
stage.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
const h=/^#p(\d+)$/.exec(location.hash);go(h?+h[1]-1:0);
